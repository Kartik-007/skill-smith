[project]
name = "skillsmith"
version = "0.1.0"
description = "Skill Smith core: MuJoCo packing sim, referee, harness evolution, durable queue"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.0",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pillow>=12.3.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "raindrop-ai>=0.0.75",
    "raindrop-query>=0.1.14",
]

[project.scripts]
skillsmith = "skillsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillsmith"]
